name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'
  # Yarn enables hardened mode on every public pull request and re-resolves the whole lockfile.
  # Same-repository branches already have write access, so only fork pull requests keep it.
  YARN_ENABLE_HARDENED_MODE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'true' || 'false' }}
  # What the packaging cache holds depends on the product version the prepared runtime records and
  # on the Electron, electron-builder and pnpm releases it downloads or embeds, not on the lockfile.
  PACKAGING_CACHE_INPUTS: >-
    const m = require('./dsh-plugin-desktop-beta/package.json');
    [m.version, 'electron' + m.devDependencies.electron, 'builder' + m.devDependencies['electron-builder'], 'pnpm' + m.dependencies.pnpm].join('-')

# Pull requests only restore caches; pushes and manual runs save them. Pull requests therefore never
# upload duplicates of master's entries or evict them from the repository's cache budget.
jobs:
  # Keep required checks conclusive for documentation-only changes. Workflow
  # path filters can leave required checks pending, so classify inside the run.
  changes:
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.scope.outputs.product }}
    steps:
      - uses: actions/checkout@v6
        with:
          # GitHub's pull-request merge ref can retain the base branch's
          # submodule gitlink when the PR advances it to a descendant. Check
          # out the actual PR head so pinned submodules match upstream.json.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - name: Classify changed paths
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node --test scripts/bilingual-docs.test.mjs
          node scripts/verify-bilingual-docs.mjs
          node --test scripts/market-dependency-direction.test.mjs
          node scripts/verify-market-dependency-direction.mjs
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            product=true
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --check "$BASE_SHA" "$HEAD_SHA"
            product="$(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" | node scripts/classify-ci-changes.mjs)"
          fi
          echo "product=$product" >> "$GITHUB_OUTPUT"

  # Product gate: a documentation-only change already passed diff validation in `changes`.
  check:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only gate
        if: needs.changes.outputs.product == 'false'
        run: echo "Documentation-only change; product build and tests are not required."
      - uses: actions/checkout@v6
        if: needs.changes.outputs.product == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        if: needs.changes.outputs.product == 'true'
        with:
          node-version: 22.23.2
      - if: needs.changes.outputs.product == 'true'
        run: corepack enable
      - name: Resolve Yarn cache folder
        if: needs.changes.outputs.product == 'true'
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - name: Restore Yarn cache
        if: needs.changes.outputs.product == 'true'
        id: yarn-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
          restore-keys: |
            yarn-${{ runner.os }}-${{ runner.arch }}-
      - if: needs.changes.outputs.product == 'true'
        run: yarn install --immutable
      - name: Save Yarn cache
        if: needs.changes.outputs.product == 'true' && github.event_name != 'pull_request' && steps.yarn-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ steps.yarn-cache.outputs.cache-primary-key }}
      # Beta mirrors Next, so the root check runs the full Next gate and only the Beta specs its
      # channel-specific files can change. The packaging jobs boot the packaged Beta Host on every OS.
      - if: needs.changes.outputs.product == 'true'
        run: yarn check
      - name: Resolve Playwright version
        if: needs.changes.outputs.product == 'true'
        id: playwright-version
        run: echo "version=$(node -p "require('./dsh-desktop-next/package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        if: needs.changes.outputs.product == 'true'
        id: playwright-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium for Next window regression
        if: needs.changes.outputs.product == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: yarn workspace dsh-desktop-next exec playwright install chromium
      - name: Save Playwright browsers
        if: needs.changes.outputs.product == 'true' && github.event_name != 'pull_request' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
      - name: Verify Next window controls, onboarding, protocol, and sidebar Browser in parallel
        if: needs.changes.outputs.product == 'true'
        run: |
          node scripts/run-parallel.mjs \
            "yarn workspace dsh-desktop-next verify:window-controls" \
            "yarn workspace dsh-desktop-next verify:onboarding" \
            "xvfb-run --auto-servernum yarn workspace dsh-desktop-next verify:protocol --no-sandbox" \
            "xvfb-run --auto-servernum yarn workspace dsh-desktop-next verify:sidebar-browser --no-sandbox"

  # Windows on a real runner: the upstream toolchain smoke, then unsigned NSIS and portable builds.
  # The package gate runs once; both artifacts reuse its build output.
  desktop-windows:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      # The portable-shell upstream scripts must resolve the pinned submodule's own pnpm release on Windows.
      - name: Resolve the upstream toolchain
        run: yarn upstream:version
      - name: Resolve Yarn cache folder
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> "$env:GITHUB_OUTPUT"
      - name: Restore Yarn cache
        id: yarn-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
          restore-keys: |
            yarn-${{ runner.os }}-${{ runner.arch }}-
      - name: Resolve packaging cache inputs
        id: packaging-inputs
        shell: bash
        run: echo "versions=$(node -p "$PACKAGING_CACHE_INPUTS")" >> "$GITHUB_OUTPUT"
      - name: Restore primary runtime and Electron Builder downloads
        id: packaging-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            dsh-plugin-desktop-beta/.desktop-build/downloads
            dsh-plugin-desktop-beta/.desktop-build/runtime
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: packaging-downloads-${{ runner.os }}-${{ runner.arch }}-dsh-plugin-desktop-beta-${{ steps.packaging-inputs.outputs.versions }}-${{ hashFiles('deepseek-harness/scripts/primary-runtime/lock.json') }}
          restore-keys: |
            packaging-downloads-${{ runner.os }}-${{ runner.arch }}-dsh-plugin-desktop-beta-
      - run: yarn install --immutable
      - name: Save Yarn cache
        if: github.event_name != 'pull_request' && steps.yarn-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ steps.yarn-cache.outputs.cache-primary-key }}
      # Typecheck is platform-neutral and already gated by `check`.
      - run: yarn workspace dsh-plugin-desktop-beta check:win-package:platform
      - name: Build Windows installer
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
          # CI artifacts are never published; skipping compression saves minutes.
          DSH_WINDOWS_PACKAGE_COMPRESSION: store
        run: yarn workspace dsh-plugin-desktop-beta dist:win
      - name: Build Windows portable archive
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
          DSH_WINDOWS_PACKAGE_COMPRESSION: store
          DSH_WINDOWS_REUSE_UNPACKED: '1'
        run: yarn workspace dsh-plugin-desktop-beta dist:win-portable
      - name: Save primary runtime and Electron Builder downloads
        if: github.event_name != 'pull_request' && steps.packaging-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            dsh-plugin-desktop-beta/.desktop-build/downloads
            dsh-plugin-desktop-beta/.desktop-build/runtime
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ steps.packaging-cache.outputs.cache-primary-key }}

  # Linux x64 distribution artifacts: unsigned AppImage and Debian package
  # built on a stock ubuntu runner, mirroring the Windows packaging job.
  desktop-linux:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - name: Restore Yarn cache
        id: yarn-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
          restore-keys: |
            yarn-${{ runner.os }}-${{ runner.arch }}-
      - name: Resolve packaging cache inputs
        id: packaging-inputs
        run: echo "versions=$(node -p "$PACKAGING_CACHE_INPUTS")" >> "$GITHUB_OUTPUT"
      - name: Restore primary runtime and Electron Builder downloads
        id: packaging-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            dsh-plugin-desktop-beta/.desktop-build/downloads
            dsh-plugin-desktop-beta/.desktop-build/runtime
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/.cache/node-gyp
          key: packaging-downloads-${{ runner.os }}-${{ runner.arch }}-dsh-plugin-desktop-beta-${{ steps.packaging-inputs.outputs.versions }}-${{ hashFiles('deepseek-harness/scripts/primary-runtime/lock.json') }}
          restore-keys: |
            packaging-downloads-${{ runner.os }}-${{ runner.arch }}-dsh-plugin-desktop-beta-
      - run: yarn install --immutable
      - name: Save Yarn cache
        if: github.event_name != 'pull_request' && steps.yarn-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ steps.yarn-cache.outputs.cache-primary-key }}
      - run: yarn workspace dsh-plugin-desktop-beta check:linux-package:platform
      - name: Build Linux AppImage and Debian package
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
          DSH_LINUX_PACKAGE_COMPRESSION: store
        run: yarn workspace dsh-plugin-desktop-beta dist:linux
      - name: Save primary runtime and Electron Builder downloads
        if: github.event_name != 'pull_request' && steps.packaging-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            dsh-plugin-desktop-beta/.desktop-build/downloads
            dsh-plugin-desktop-beta/.desktop-build/runtime
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/.cache/node-gyp
          key: ${{ steps.packaging-cache.outputs.cache-primary-key }}

  # macOS-only universal packaging smoke on a real macOS runner: the signed
  # release is built manually on a credentialed machine, so an unsigned DMG
  # here catches Intel and Apple Silicon packaging regressions before a manual
  # release. No signing secrets ever reach this job.
  desktop-macos:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - name: Restore Yarn cache
        id: yarn-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
          restore-keys: |
            yarn-${{ runner.os }}-${{ runner.arch }}-
      - name: Resolve packaging cache inputs
        id: packaging-inputs
        run: echo "versions=$(node -p "$PACKAGING_CACHE_INPUTS")" >> "$GITHUB_OUTPUT"
      - name: Restore primary runtime and Electron Builder downloads
        id: packaging-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            dsh-plugin-desktop-beta/.desktop-build/downloads
            dsh-plugin-desktop-beta/.desktop-build/runtime
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/Library/Caches/node-gyp
          key: packaging-downloads-${{ runner.os }}-${{ runner.arch }}-dsh-plugin-desktop-beta-${{ steps.packaging-inputs.outputs.versions }}-${{ hashFiles('deepseek-harness/scripts/primary-runtime/lock.json') }}
          restore-keys: |
            packaging-downloads-${{ runner.os }}-${{ runner.arch }}-dsh-plugin-desktop-beta-
      # Pull requests restore master's universal runtime but package only arm64. Dropping the Intel
      # payload lets the prepared arm64 runtime be reused instead of rebuilt.
      - name: Keep only the arm64 runtime for the pull-request smoke
        if: github.event_name == 'pull_request'
        run: rm -rf dsh-plugin-desktop-beta/.desktop-build/runtime/x64
      - run: yarn install --immutable
      - name: Save Yarn cache
        if: github.event_name != 'pull_request' && steps.yarn-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ steps.yarn-cache.outputs.cache-primary-key }}
      - run: yarn workspace dsh-plugin-desktop-beta check:mac-package:platform
      - name: Build macOS smoke artifact
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
          # The universal merge alone takes 9-17 minutes, so pull requests
          # package only the runner's native arm64 app. Pushes to master and
          # manual runs keep the full universal DMG.
          DSH_MAC_SMOKE_ARCH: ${{ github.event_name == 'pull_request' && 'arm64' || 'universal' }}
          DSH_MAC_PACKAGE_COMPRESSION: store
        run: yarn workspace dsh-plugin-desktop-beta dist:mac-smoke
      - name: Save primary runtime and Electron Builder downloads
        if: github.event_name != 'pull_request' && steps.packaging-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            dsh-plugin-desktop-beta/.desktop-build/downloads
            dsh-plugin-desktop-beta/.desktop-build/runtime
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/Library/Caches/node-gyp
          key: ${{ steps.packaging-cache.outputs.cache-primary-key }}
