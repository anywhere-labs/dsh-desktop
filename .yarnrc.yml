enableScripts: false
nmHoistingLimits: workspaces
nodeLinker: node-modules

# DSH releases are built against these exact upstream framework/native releases.
# Keep every exception version-scoped so newer registry releases still age-gate.
npmPreapprovedPackages:
  - "@deepseek-ai/cosmokit@1.8.3"
  - "@deepseek-ai/cordis@4.0.2"
  - "@deepseek-ai/cordis-plugin-group@1.0.2"
  - "@deepseek-ai/cordis-plugin-hmr@1.0.17"
  - "@deepseek-ai/cordis-plugin-include@1.0.7"
  - "@deepseek-ai/cordis-plugin-loader@1.0.3"
  - "@deepseek-ai/cordis-plugin-timer@1.1.4"
  - "@deepseek-ai/schemastery@3.18.2"
  - "@deepseek-ai/node-addon-system@0.1.2"
  - "@deepseek-ai/node-addon-system-darwin-arm64@0.1.2"
  - "@deepseek-ai/node-addon-system-darwin-x64@0.1.2"
  - "@deepseek-ai/node-addon-system-linux-arm64@0.1.2"
  - "@deepseek-ai/node-addon-system-linux-x64@0.1.2"

# macOS releases are universal, so the physical node_modules tree must contain
# both Darwin CPU variants before Electron Builder assembles the two slices.
supportedArchitectures:
  os:
    - current
  cpu:
    - current
    - x64
    - arm64
