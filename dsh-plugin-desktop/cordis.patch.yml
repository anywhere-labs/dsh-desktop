# Desktop Host operations compose around the existing Web bundle. Compatibility
# mode keeps upstream ownership of the browser carrier and rendered UI.
- insert:
    - id: desktop-shell
      name: dsh-plugin-desktop
      config:
        mode: compatibility
    - id: desktop-terminal
      name: dsh-plugin-desktop/terminal
      disabled: !!js process.platform === 'linux'
    - id: desktop-diagnostics
      name: dsh-plugin-desktop/diagnostics
    - id: desktop-notifications
      name: dsh-plugin-desktop/notifications
    - id: desktop-pnpm
      name: dsh-plugin-desktop/pnpm
    - id: desktop-profiles
      name: dsh-plugin-desktop/profiles
    - id: desktop-updates
      name: dsh-plugin-desktop/updates
      # Aera Code releases are source-custodied. The inherited upstream update
      # service must not offer a differently branded Desktop artifact.
      disabled: true

# A desktop launch has no terminal operator waiting for the Web readiness line.
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: []

# Aera Code is an AERA Gateway client. Its deployment default must not fall
# back to the upstream provider when shared user settings are absent.
- id: agent-default-model
  config:
    provider: aera-gateway
    model: aera/active

# Keep the upstream adapter in the dependency closure for provenance and
# compatibility tests, but remove it from the Aera Code runtime catalogue.
- id: llm-deepseek
  disabled: true
