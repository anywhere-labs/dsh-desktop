# Desktop Host operations compose around the existing Web bundle. Compatibility
# mode keeps upstream ownership of the browser carrier and rendered UI.
- id: ui-sidebar-browser
  # Desktop capability does not depend on the user's Profile name. The later
  # user patch can still disable the Browser explicitly.
  disabled: false

- insert:
    - id: desktop-shell
      name: dsh-plugin-desktop
      config:
        mode: compatibility
    - id: desktop-terminal
      name: dsh-plugin-desktop/terminal
      disabled: !!js process.platform === 'linux'
    - id: desktop-diagnostics
      name: dsh-plugin-desktop/diagnostics
    - id: desktop-notifications
      name: dsh-plugin-desktop/notifications
    # Durable memory stays available for explicit compaction checkpoints. It
    # injects a new version once per turn, never raw history or every turn.
    - id: desktop-context
      name: dsh-plugin-desktop/context
      config:
        foldEvery: 4
        maxTokens: 1024
        recall: true
        fileIndex: false
        fileRecall: false
    # Hard loop breaker plus the mandatory de-noised reflection/reset.
    - id: desktop-loop-guard
      name: dsh-plugin-desktop/loop-guard
    # Keyless DuckDuckGo search backend (default off). Enable by removing the
    # `disabled` below and pinning `searchProvider: duckduckgo` on the `web` row.
    - id: desktop-web-search
      name: dsh-plugin-desktop/web-search
      disabled: true
    - id: desktop-pnpm
      name: dsh-plugin-desktop/pnpm
    - id: desktop-profiles
      name: dsh-plugin-desktop/profiles
    - id: desktop-updates
      name: dsh-plugin-desktop/updates

# A desktop launch has no terminal operator waiting for the Web readiness line.
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: []
