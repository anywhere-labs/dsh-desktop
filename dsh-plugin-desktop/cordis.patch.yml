# Desktop Host operations compose around the existing Web bundle. Compatibility
# mode keeps upstream ownership of the browser carrier and rendered UI.
- id: ui-sidebar-browser
  # Desktop capability does not depend on the user's Profile name. The later
  # user patch can still disable the Browser explicitly.
  disabled: false

- insert:
    - id: desktop-shell
      name: dsh-plugin-desktop
      config:
        mode: compatibility
    - id: desktop-terminal
      name: dsh-plugin-desktop/terminal
      disabled: !!js process.platform === 'linux'
    - id: desktop-diagnostics
      name: dsh-plugin-desktop/diagnostics
    - id: desktop-notifications
      name: dsh-plugin-desktop/notifications
    - id: desktop-pnpm
      name: dsh-plugin-desktop/pnpm
    - id: desktop-profiles
      name: dsh-plugin-desktop/profiles
    - id: desktop-updates
      name: dsh-plugin-desktop/updates
    - id: desktop-android-logcat
      name: dsh-plugin-desktop/android-logcat
    - id: desktop-git-review
      name: dsh-plugin-desktop/git-review
    - id: desktop-ide-git
      name: dsh-ide-git

# A desktop launch has no terminal operator waiting for the Web readiness line.
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: []

# Size-capped model endpoints (observed: GitHub Copilot rejects multi-image
# sessions with HTTP 413) need durable images stored small, not merely rejected
# large: normalize every saved image to a 1568px long edge within 240KiB, so
# several inline screenshots stay well under a 1MiB-class request-body limit.
- id: attachment-local
  config:
    normalizedImageMaxBytes: 245760
    normalizedImageMaxDimension: 1568
