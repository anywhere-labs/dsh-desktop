version: 1
schema: operation-reliability-matrix/v1
operations:
  - id: startup-renderer-health
    owner: DesktopRendererHealthGate (src/renderer-health.ts)
    entrypoints: [begin, report, acceptNativeMount, fail, stop]
    deadline: { owner: DesktopRendererHealthGate, maximum: renderer-boot-timeout }
    cancellation: { owner: DesktopRendererHealthGate, behavior: stop rejects pending verdict }
    exclusivity: one gate per renderer generation
    idempotency: first terminal verdict wins; later evidence is ignored
    persistedState: { owner: startup-state-commit.ts, atomic: true, corruption: fail-loud, cleanup: startup lifecycle }
    retry: { policy: none, reason: retry belongs to startup recovery orchestration }
    recovery: durable failure reason is retained for next-generation recovery UI
    evidence: renderer boot report and durable healthy marker
    faultContracts:
      - { id: startup-renderer-health.stage.timeout, test: tests/renderer-health.spec.ts, title: settles a timeout once without committing healthy }
      - { id: startup-renderer-health.stage.commit.disk-full, test: tests/renderer-health.spec.ts, title: rejects the verdict when the durable healthy commit fails }
  - id: profile-switch
    owner: DesktopProfileService (src/profile-service.ts)
    entrypoints: [select, create]
    deadline: { owner: DesktopProfileService, maximum: delegated persistence/restart completion }
    cancellation: { owner: DesktopProfileService, behavior: disposed service rejects retained calls }
    exclusivity: one pending persisted target per service
    idempotency: selecting the current profile is a no-op; pending target cannot be replaced
    persistedState: { owner: profile-manager.ts, atomic: true, corruption: fail-loud, cleanup: profile manager }
    retry: { policy: explicit, authority: service after restart failure }
    recovery: retain pending target and permit only its restart retry
    evidence: persisted selected profile and restart result
    faultContracts:
      - { id: profile-switch.stage.persist.failure, test: tests/profile-service.spec.ts, title: does not restart after persistence fails and permits a later valid selection }
      - { id: profile-switch.stage.restart.failure, test: tests/profile-service.spec.ts, title: retains a persisted target after restart failure and retries only that restart }
  - id: plugin-install-recovery
    owner: DesktopInstallRecoveryStore (src/install-recovery.ts)
    entrypoints: [begin, seal, claim, restore, requestRetry]
    deadline: { owner: package operation, maximum: delegated package manager deadline }
    cancellation: { owner: package operation, behavior: WAL remains recoverable after interruption }
    exclusivity: file lock and one active transaction per profile
    idempotency: transaction and generation claims are opaque and phase-bound
    persistedState: { owner: DesktopInstallRecoveryStore, atomic: true, corruption: manual-recovery, cleanup: explicit clear }
    retry: { policy: one next-generation retry, authority: recovery UI }
    recovery: rollback admitted pre/post images or require manual recovery on drift
    evidence: hash-only WAL, receipt id, failure reason, lifecycle diagnostics
    faultContracts:
      - { id: plugin-install-recovery.begin.before-publish, test: tests/install-recovery.spec.ts, title: removes incomplete backups when a preimage write fails before WAL publication }
      - { id: plugin-install-recovery.begin.after-publish, test: tests/install-recovery.spec.ts, title: removes complete backups when WAL publication fails }
      - { id: plugin-install-recovery.seal.after-publish, test: tests/install-recovery.spec.ts, title: keeps a prepared WAL when postimage sealing fails and denies unknown automatic rollback }
      - { id: plugin-install-recovery.rollback.partial-write, test: tests/install-recovery.spec.ts, title: retains recovery authority when rollback fails after restoring one file }
      - { id: plugin-install-recovery.rollback.terminal-publish, test: tests/install-recovery.spec.ts, title: replays rollback when terminal WAL publication fails after files are restored }
      - { id: plugin-install-recovery.restore.malformed, test: tests/install-recovery.spec.ts, title: validates every backup before replacing any profile file }
      - { id: plugin-install-recovery.claim.retry, test: tests/install-recovery.spec.ts, title: persists failed verification and consumes at most one retry in the next generation }
  - id: update-check
    owner: checkForStableUpdate (src/update-checker.ts)
    entrypoints: [checkForStableUpdate]
    deadline: { owner: caller, maximum: caller request deadline }
    cancellation: { owner: caller, behavior: abort signal is passed to request }
    exclusivity: caller-owned
    idempotency: read-only comparison against current version
    persistedState: { policy: none, reason: no durable state is created }
    retry: { policy: none, reason: caller schedules later checks }
    recovery: ignore malformed, non-success, network, and cancelled responses
    evidence: typed comparison result or silent absence of update
    faultContracts:
      - { id: update-check.network.cancelled, test: tests/update-checker.spec.ts, title: silently ignores network failure and caller cancellation }
      - { id: update-check.response.oversized, test: tests/update-checker.spec.ts, title: silently ignores declared and streamed oversized responses }
  - id: update-download-handoff
    owner: downloadDesktopUpdate (src/update-download.ts)
    entrypoints: [downloadDesktopUpdate, recordDesktopUpdateArtifact, resolveDesktopUpdateArtifact]
    deadline: { owner: caller, maximum: caller request deadline }
    cancellation: { owner: caller, behavior: abort removes partial artifact }
    exclusivity: atomic destination replacement
    idempotency: validated destination may replace only after complete download
    persistedState: { owner: update-download.ts, atomic: true, corruption: typed failure, cleanup: download operation }
    retry: { policy: caller-controlled, authority: caller after partial cleanup }
    recovery: preserve existing installer until replacement validates; never hand off partial artifact
    evidence: validated artifact and pending installer receipt
    faultContracts:
      - { id: update-download-handoff.network.cancelled, test: tests/update-download.spec.ts, title: passes the caller signal and removes a partial file when aborted during streaming }
      - { id: update-download-handoff.artifact.validation, test: tests/update-download.spec.ts, title: keeps an existing destination until its validated replacement is ready }
  - id: diagnostics-export
    owner: exportDiagnosticsZip (src/diagnostic-export.ts)
    entrypoints: [exportDiagnosticsZip, exportDesktopDiagnostics]
    deadline: { owner: exportDiagnosticsZip, maximum: 60000ms }
    cancellation: { owner: exportDiagnosticsZip, behavior: abort terminates worker }
    exclusivity: one short-lived worker per export request
    idempotency: each export publishes a distinct archive and bounded retained history
    persistedState: { owner: diagnostic-export-worker.ts, atomic: true, corruption: typed failure, cleanup: archive retention }
    retry: { policy: caller-controlled, authority: diagnostics UI }
    recovery: terminate stalled worker and preserve existing archives
    evidence: bounded zip containing logs, lifecycle evidence, and system info
    faultContracts:
      - { id: diagnostics-export.worker.timeout, test: tests/diagnostic-export.spec.ts, title: terminates a diagnostic Worker that does not respond before its deadline }
      - { id: diagnostics-export.worker.cancelled, test: tests/diagnostic-export.spec.ts, title: terminates a diagnostic Worker when its owning operation is cancelled }
